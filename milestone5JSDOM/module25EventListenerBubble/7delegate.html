<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Delegate</title>
</head>

<body>
    <h1>Explore Event Delegate</h1>
    <!-- ol#item-list>li.item*6{My Awesome Item $} -->
    <ol id="item-list">
        <li class="item">My Awesome Item 1</li>
        <li class="item">My Awesome Item 2</li>
        <li class="item">My Awesome Item 3</li>
        <li class="item">My Awesome Item 4</li>
        <li class="item">My Awesome Item 5</li>
        <li class="item">My Awesome Item 6</li>
    </ol>
    <input id="new-item" type="text" placeholder="enter item">
    <button id="btn-add-item">Add new item</button>

    <script>
        // const items = document.getElementsByClassName('item');
        // for (const item of items) {
        //     item.addEventListener('click', function (event) {
        //         // console.log(event.target)
        //         event.target.parentNode.removeChild(event.target);
        //     })
        // }
        document.getElementById('item-list')
            .addEventListener('click', function(event){
                event.target.parentNode.removeChild(event.target);
            })
        document.getElementById('btn-add-item')
            .addEventListener('click', function (event) {
                const Nitem = document.getElementById('new-item');
                const NitemValue = Nitem.value;
                console.log(NitemValue);
                const Newli = document.createElement('li');
                Newli.innerText = NitemValue;
                const itemParent = document.getElementById('item-list');
                itemParent.appendChild(Newli);
                Newli.classList.add('item')
            })


    </script>
</body>

</html>
