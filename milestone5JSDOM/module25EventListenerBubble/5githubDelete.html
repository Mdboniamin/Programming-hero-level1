<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="h1-secret">My secret info</h1>
    <input id="input-delete" placeholder="Type delete"
     type="text">
    <button id="btn-delete" disabled>Delete</button>

    <script>
        document.getElementById('input-delete')
        .addEventListener('keyup', function(event){
            const text = event.target.value;
            const btnDelete = document.getElementById('btn-delete');
            const h1Secret = document.getElementById('h1-secret');
            if(text === 'delete'){
                console.log('delete button typed');
                btnDelete.removeAttribute('disabled');
                
                btnDelete.addEventListener('click', function(){
                    h1Secret.style.display = 'none';
                })
            } else {
                console.log('something else typed');
                btnDelete.setAttribute('disabled', true);
            }
        })
    </script>
</body>
</html>
